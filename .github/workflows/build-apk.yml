name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.31.6" "build-tools;36.0.0" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generated host headers (DM_GEN_DIR)
        run: |
          python3 dm/ios/tools/shell_stubs.py stubs-gen ci-gen
          test -f ci-gen/dm_bright_levels.inc || printf '/* stand-in: no BL2 data */\n' > ci-gen/dm_bright_levels.inc
          ls -l ci-gen

      - name: Build debug APK
        run: |
          gradle -p dm/android :app:assembleDebug \
            -PdmGame=bl2 -PdmAppId=org.bl2.port -PdmPython=python3 \
            -PdmGenDir="$PWD/ci-gen" --console plain

      - name: Collect APK
        run: |
          cp dm/android/app/build/outputs/apk/debug/app-debug.apk BL2-port.apk
          sha256sum BL2-port.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BL2-port-apk
          path: BL2-port.apk

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BL2-port.apk
          generate_release_notes: true
