name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "ndk;29.0.14206865" "cmake;3.31.6" "build-tools;36.0.0" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generated host headers (DM_GEN_DIR)
        run: |
          mkdir -p ci-gen
          : > ci-gen/dm_vault_tab.h
          : > ci-gen/dm_hud_exp.h
          : > ci-gen/dm_bright_levels.inc
          : > ci-gen/dm_touch_native_art.c
          ls -l ci-gen

      - name: Build debug APK
        run: |
          gradle -p dm/android :app:assembleDebug \
            -PdmGame=bl2 -PdmAppId=org.bl2.port -PdmPython=python3 \
            -PdmGenDir="$PWD/ci-gen" --console plain

      - name: Collect APK
        run: |
          cp dm/android/app/build/outputs/apk/debug/app-debug.apk BL2-port.apk
          sha256sum BL2-port.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BL2-port-apk
          path: BL2-port.apk

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BL2-port.apk
          generate_release_notes: true
