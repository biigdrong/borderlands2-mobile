name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "ndk;29.0.14206865" "cmake;3.31.6" "build-tools;36.0.0" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generated host headers (DM_GEN_DIR)
        run: |
          mkdir -p ci-gen
          : > ci-gen/dm_bright_levels.inc
          cat > ci-gen/dm_touch_native_art.c <<'EOF'
          // CI stand-in (no game data): skill art is empty; same shape as dm/host/doom_stubs.c
          #include <stdint.h>
          #include <string.h>
          #include "dm_touch_native_art.h"
          dm_ta_glyph dm_ta_skill(uint32_t raw_skill_id) { dm_ta_glyph g = {0}; g.raw_skill_id = raw_skill_id; g.reason = "ci"; return g; }
          dm_ta_glyph dm_ta_current_set(const dm_tg_snapshot *s, uint64_t sdk_button, uint64_t host_now_ns, int skill_set) {
              (void)s; (void)sdk_button; (void)host_now_ns; (void)skill_set; dm_ta_glyph g = {0}; g.reason = "ci"; return g; }
          int dm_ta_frame_at(int atlas, int frame, dm_ta_frame *out) { (void)atlas; (void)frame; if (out) memset(out, 0, sizeof *out); return 0; }
          EOF
          cat > ci-gen/dm_vault_tab.h <<'EOF'
          // CI stand-in (no game data): the fixed table loads from dm/derived.tsv at run time.
          #pragma once
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include "dm_derived_rt.h"
          #define VT_NPART 1
          static const char *vt_part_name[VT_NPART];
          typedef struct { uint8_t kind, part, tier; uint16_t row, lvl; int16_t set; const char *key, *icon; } vt_row;
          static vt_row vt_rows[1];
          #define VT_NROW 1
          static const char *vt_set_key[1];
          #define VT_NSET 1
          static void vt_part_cb(char **f, int n, void *ctx) { int *i = ctx; if (n >= 1 && *i < VT_NPART) vt_part_name[(*i)++] = strdup(f[0]); }
          static void vt_set_cb(char **f, int n, void *ctx) { int *i = ctx; if (n >= 1 && *i < VT_NSET) vt_set_key[(*i)++] = strdup(f[0]); }
          static void vt_row_cb(char **f, int n, void *ctx) { int *i = ctx; if (n < 8 || *i >= VT_NROW) return;
              vt_rows[(*i)++] = (vt_row){ (uint8_t)atoi(f[0]), (uint8_t)atoi(f[1]), (uint8_t)atoi(f[2]), (uint16_t)atoi(f[3]), (uint16_t)atoi(f[4]), (int16_t)atoi(f[5]), strdup(f[6]), strdup(f[7]) }; }
          static int vt_load(void) { int a = 0, b = 0, c = 0;
              dm_derived_each("VTPART", vt_part_cb, &a); dm_derived_each("VTROW", vt_row_cb, &b); dm_derived_each("VTSET", vt_set_cb, &c);
              for (int i = a; i < VT_NPART; i++) vt_part_name[i] = ""; for (int i = c; i < VT_NSET; i++) vt_set_key[i] = "";
              for (int i = b; i < VT_NROW; i++) vt_rows[i] = (vt_row){ .set = -1, .key = "", .icon = "" };
              return a == VT_NPART && b == VT_NROW && c == VT_NSET ? 0 : -1; }
          __attribute__((constructor)) static void vt_reg(void) { dm_derived_register(vt_load); }
          EOF
          cat > ci-gen/dm_hud_exp.h <<'EOF'
          // CI stand-in (no game data): the table loads from dm/derived.tsv at run time.
          #pragma once
          #include <stdint.h>
          #include <stdlib.h>
          #include "dm_derived_rt.h"
          static uint32_t k_exp[100];
          static void k_exp_row(char **f, int n, void *ctx) { int *i = ctx; for (int k = 0; k < n && *i < 100; k++) k_exp[(*i)++] = (uint32_t)strtoul(f[k], NULL, 10); }
          static int k_exp_load(void) { int i = 0; dm_derived_each("EXP", k_exp_row, &i); return i == 100 ? 0 : -1; }
          __attribute__((constructor)) static void k_exp_reg(void) { dm_derived_register(k_exp_load); }
          EOF
          ls -l ci-gen

      - name: Restore fixed debug keystore
        env:
          KEY_B64: ${{ secrets.DM_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEY_B64" | base64 -d > ~/.android/debug.keystore
            ls -l ~/.android/debug.keystore
          else
            echo "no DM_DEBUG_KEYSTORE_B64; the APK will get a random debug signature"
          fi

      - name: Build debug APK
        run: |
          gradle -p dm/android :app:assembleDebug \
            -PdmGame=bl2 -PdmAppId=org.bl2.port -PdmPython=python3 \
            -PdmGenDir="$PWD/ci-gen" -PdmDebugKeystore="$HOME/.android/debug.keystore" --console plain

      - name: Collect APK
        run: |
          cp dm/android/app/build/outputs/apk/debug/app-debug.apk BL2-port.apk
          sha256sum BL2-port.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BL2-port-apk
          path: BL2-port.apk

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BL2-port.apk
          generate_release_notes: true
